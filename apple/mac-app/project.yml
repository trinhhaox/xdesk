name: Xdesk
options:
  bundleIdPrefix: vn.xox
  # Ngôn ngữ gốc là tiếng Việt, bản dịch tiếng Anh nằm trong Localizable.xcstrings; Sparkle tự theo ngôn ngữ app đang dùng.
  developmentLanguage: vi
  deploymentTarget:
    macOS: "14.0"
packages:
  XdeskKit:
    path: ../Packages/XdeskKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4DU4BTV46U
    CODE_SIGN_STYLE: Automatic
targets:
  Xdesk-mac:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: XdeskKit
        product: XdeskWire
      - package: XdeskKit
        product: XdeskCrypto
      - package: XdeskKit
        product: XdeskTransport
      - package: XdeskKit
        product: XdeskMedia
      - package: XdeskKit
        product: XdeskViewer
      - package: XdeskKit
        product: XdeskInput
      - package: XdeskKit
        product: XdeskClipboard
      - package: XdeskKit
        product: XdeskAgent
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Xdesk
        CFBundleLocalizations: [vi, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://raw.githubusercontent.com/trinhhaox/xdesk-releases/main/appcast.xml
        SUPublicEDKey: 0XSjDfyqlPwck1B2l1vEUM47fqblteePURtvIzwiGRE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: true
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: Xdesk dùng mạng nội bộ để tìm và kết nối thiết bị của bạn.
        NSBonjourServices: [_xdesk._tcp]
    entitlements:
      path: Sources/Xdesk.entitlements
      properties:
        com.apple.security.app-sandbox: false
        keychain-access-groups: ["$(AppIdentifierPrefix)vn.xox.xdesk"]
    settings:
      base:
        PRODUCT_NAME: Xdesk
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.xdesk
        MARKETING_VERSION: 0.1.0-beta
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Host/Xdesk-Bridging-Header.h
  Xdesk-mac-tests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Xdesk-mac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.xdesk.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Xdesk.app/Contents/MacOS/Xdesk
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Xdesk-mac:
    build:
      targets:
        Xdesk-mac: all
    test:
      targets: [Xdesk-mac-tests]
      # Test so khớp chuỗi tiếng Việt nên cố định ngôn ngữ, không phụ thuộc máy chạy.
      language: vi
      region: VN
