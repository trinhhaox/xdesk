name: XdeskIOS
options:
  bundleIdPrefix: vn.xox
  # iOS chưa có bản tiếng Anh: cố định tiếng Việt để chuỗi đã dịch trong XdeskKit không lẫn tiếng Anh.
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
packages:
  XdeskKit:
    path: ../Packages/XdeskKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4DU4BTV46U
    CODE_SIGN_STYLE: Automatic
targets:
  Xdesk-ios:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: XdeskKit
        product: XdeskWire
      - package: XdeskKit
        product: XdeskCrypto
      - package: XdeskKit
        product: XdeskTransport
      - package: XdeskKit
        product: XdeskMedia
      - package: XdeskKit
        product: XdeskViewer
      - package: XdeskKit
        product: XdeskInput
      - package: XdeskKit
        product: XdeskClipboard
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Xdesk
        CFBundleLocalizations: [vi]
        UILaunchScreen: {}
        # Only CryptoKit (encryption provided by iOS) is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Xdesk dùng mạng nội bộ để tìm và kết nối với máy Mac của bạn.
        NSBonjourServices: [_xdesk._tcp]
        LSApplicationQueriesSchemes: [tailscale]
        NSCameraUsageDescription: Xdesk dùng camera để quét mã QR ghép đôi hiện trên màn hình máy Mac của bạn.
        NSFaceIDUsageDescription: Xdesk dùng Face ID để xác thực trước khi mở khoá máy Mac từ xa.
    settings:
      base:
        PRODUCT_NAME: Xdesk
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.xdesk.ios
        MARKETING_VERSION: 0.2.1-beta
        CURRENT_PROJECT_VERSION: 11
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  Xdesk-ios-tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Xdesk-ios
      - package: XdeskKit
        product: XdeskWire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.xdesk.ios.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Xdesk.app/Xdesk
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Xdesk-ios:
    build:
      targets:
        Xdesk-ios: all
    test:
      targets: [Xdesk-ios-tests]
      language: vi
      region: VN
