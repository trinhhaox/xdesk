name: XdeskIOS
options:
  bundleIdPrefix: vn.xox
  deploymentTarget:
    iOS: "17.0"
packages:
  XdeskKit:
    path: ../Packages/XdeskKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4DU4BTV46U
    CODE_SIGN_STYLE: Automatic
targets:
  Xdesk-ios:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: XdeskKit
        product: XdeskWire
      - package: XdeskKit
        product: XdeskCrypto
      - package: XdeskKit
        product: XdeskTransport
      - package: XdeskKit
        product: XdeskMedia
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Xdesk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Xdesk dùng mạng nội bộ để tìm và kết nối với máy Mac của bạn.
        NSBonjourServices: [_xdesk._tcp]
    settings:
      base:
        PRODUCT_NAME: Xdesk
        PRODUCT_BUNDLE_IDENTIFIER: vn.xox.xdesk.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
schemes:
  Xdesk-ios:
    build:
      targets:
        Xdesk-ios: all
